name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore missing C++ source repositories
        shell: bash
        run: |
          set -euo pipefail
          git config -f .gitmodules --list | while IFS='=' read -r key path; do
            case "$key" in
              submodule.*.path) ;;
              *) continue ;;
            esac
            name="${key#submodule.}"
            name="${name%.path}"
            url="$(git config -f .gitmodules --get "submodule.${name}.url")"
            if [ ! -d "$path" ]; then
              echo "Restoring missing source: $path"
              mkdir -p "$(dirname "$path")"
              git clone --depth 1 "$url" "$path"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: micewine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
