name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore missing C++ source repositories
        shell: bash
        run: |
          set -euo pipefail
          root="$(git rev-parse --show-toplevel)"
          while IFS='=' read -r key path; do
            case "$key" in
              submodule.*.path) ;;
              *) continue ;;
            esac
            name="${key#submodule.}"
            name="${name%.path}"
            url="$(git config -f .gitmodules --get "submodule.${name}.url")"
            if [ ! -e "$path/.git" ]; then
              echo "Restoring missing source repository: $path"
              rm -rf "$path"
              mkdir -p "$(dirname "$path")"
              git init "$path"
              git -C "$path" remote add origin "$url"
              submodule_sha="$(git ls-tree HEAD "$path" | awk '{print $3}')"
              if [ -z "$submodule_sha" ]; then
                echo "No pinned submodule commit found for $path" >&2
                exit 1
              fi
              git -C "$path" fetch --depth 1 origin "$submodule_sha"
              git -C "$path" checkout --detach FETCH_HEAD
            else
              echo "Source repository already present: $path"
            fi
          done < <(git config -f .gitmodules --list)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: micewine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Get Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: micewine-debug-apk
          path: ./release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MiceWine Application ${{ github.sha }}"
          tag_name: ${{ env.SHORT_SHA }}
          files: ./release-assets/app-debug.apk
